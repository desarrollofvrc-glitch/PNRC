<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "NGO",
      "@id": "https://pnrc.fvrc.org.ve/#organizacion",
      "name": "Federación Venezolana de Robótica Creativa",
      "alternateName": "FVRC",
      "url": "https://pnrc.fvrc.org.ve/",
      "logo": "https://pnrc.fvrc.org.ve/assets/img/fvrc-logo.png",
      "areaServed": { "@type": "Country", "name": "Venezuela" },
      "description": "Núcleo digital oficial para el registro, la formación y la competencia de robótica creativa en Venezuela."
    },
    {
      "@type": "WebSite",
      "@id": "https://pnrc.fvrc.org.ve/#sitio",
      "url": "https://pnrc.fvrc.org.ve/",
      "name": "Plataforma Nacional de Robótica Creativa",
      "inLanguage": "es-VE",
      "publisher": { "@id": "https://pnrc.fvrc.org.ve/#organizacion" }
    },
    {
      "@type": "Course",
      "name": "Programación en Python aplicada a IoT",
      "description": "8 semanas para dominar Python, sensores y microcontroladores con proyectos evaluados y certificado avalado por la FVRC.",
      "provider": { "@id": "https://pnrc.fvrc.org.ve/#organizacion" },
      "inLanguage": "es-VE",
      "offers": { "@type": "Offer", "price": "4500.00", "priceCurrency": "VES", "availability": "https://schema.org/LimitedAvailability" }
    },
    {
      "@type": "Event",
      "name": "Olimpiada Nacional de Robótica Creativa 2026",
      "startDate": "2026-11-14",
      "endDate": "2026-11-16",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "eventStatus": "https://schema.org/EventScheduled",
      "location": {
        "@type": "Place",
        "name": "Polideportivo José María Vargas",
        "address": { "@type": "PostalAddress", "addressLocality": "Caracas", "addressRegion": "Distrito Capital", "addressCountry": "VE" }
      },
      "organizer": { "@id": "https://pnrc.fvrc.org.ve/#organizacion" },
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "VES", "availability": "https://schema.org/InStock" }
    }
  ]
}
</script>
</head>

<body>
  <!-- Sin role="application": anularía los atajos de navegación de los lectores de pantalla -->
  <div id="app" aria-label="Plataforma Nacional de Robótica Creativa"></div>

  <!-- Estado inicial accesible mientras carga el prototipo -->
  <noscript>
    <div class="container section">
      <div class="alert alert--warning">
        <strong>Este prototipo necesita JavaScript activado.</strong>
        Actívalo en tu navegador para explorar la portada y el flujo de registro.
      </div>
    </div>
  </noscript>

  <div id="estado-inicial" class="container section">
    <div class="grid grid--3">
      <div class="card card--pad"><div class="skeleton" style="height:18px;width:60%"></div>
        <div class="skeleton" style="height:12px;margin-top:12px"></div>
        <div class="skeleton" style="height:12px;margin-top:8px;width:80%"></div></div>
      <div class="card card--pad"><div class="skeleton" style="height:18px;width:60%"></div>
        <div class="skeleton" style="height:12px;margin-top:12px"></div>
        <div class="skeleton" style="height:12px;margin-top:8px;width:80%"></div></div>
      <div class="card card--pad"><div class="skeleton" style="height:18px;width:60%"></div>
        <div class="skeleton" style="height:12px;margin-top:12px"></div>
        <div class="skeleton" style="height:12px;margin-top:8px;width:80%"></div></div>
    </div>
  </div>

  <script type="module" src="assets/js/main.js"></script>
  <script>
    /* Retira el esqueleto de carga en cuanto el router pinta la primera vista */
    window.addEventListener("load", () => {
      const esqueleto = document.getElementById("estado-inicial");
      const app = document.getElementById("app");
      if (esqueleto && app && app.children.length) esqueleto.remove();
    });
  </script>
</body>
</html>
